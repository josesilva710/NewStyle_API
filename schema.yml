components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        rua:
          type: string
          maxLength: 255
        cidade:
          type: string
          maxLength: 100
        estado:
          type: string
          maxLength: 100
        cep:
          type: string
          maxLength: 20
        numero:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
      required:
      - cep
      - cidade
      - estado
      - id
      - rua
      - user
    BlankEnum:
      enum:
      - ''
    Carrinho:
      type: object
      properties:
        itens_do_carrinho:
          type: array
          items:
            $ref: '#/components/schemas/ItemCarrinho'
          readOnly: true
        total:
          type: number
          format: double
          readOnly: true
      required:
      - itens_do_carrinho
      - total
    CategoriaEnum:
      enum:
      - calcas
      - camisas
      - bermudas
      - vestidos
      - saias
      - shorts
